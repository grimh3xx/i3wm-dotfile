# UNDERGROUND // picom — só anti-tearing na NVIDIA + apaga quem não tem foco.
# sem sombra, sem blur, sem animação, sem canto redondo.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
shadow = false;
fading = false;

# janela sem foco fica 18% mais escura — só a ativa "acende"
inactive-dim = 0.18;
inactive-dim-fixed = true;
# nunca apagar: barra, rofi, notificação, fullscreen, dropdown do claude
focus-exclude = [
  "window_type = 'dock'",
  "window_type = 'notification'",
  "class_g = 'i3bar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "fullscreen"
];
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-leader = true;

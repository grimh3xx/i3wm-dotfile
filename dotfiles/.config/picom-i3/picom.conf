# UNDERGROUND // picom — só anti-tearing na NVIDIA + apaga quem não tem foco.
# sem sombra, sem blur, sem animação, sem canto redondo.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
shadow = false;
fading = false;

# janela sem foco fica 18% mais escura — só a ativa "acende"
inactive-dim = 0.18;
inactive-dim-fixed = true;
# nunca apagar: barra, rofi, notificação, fullscreen, dropdown do claude
focus-exclude = [
  "window_type = 'dock'",
  "window_type = 'notification'",
  "class_g = 'i3bar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "fullscreen"
];
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-leader = true;

# --- blur (only shows behind translucent windows, e.g. st alpha 0.88) ---
blur: {
  method = "dual_kawase";
  strength = 5;
};
blur-background-frame = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "class_g = 'maim'",
  "class_g = 'flameshot'",
  "_GTK_FRAME_EXTENTS@"
];

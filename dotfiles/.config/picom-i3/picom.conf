# UNDERGROUND // picom — only anti-tearing on NVIDIA + dimming unfocused windows.
# no shadows, no blur, no animations, no rounded corners.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
shadow = false;
fading = false;

# unfocused windows are 18% darker — only the active one "lights up"
inactive-dim = 0.18;
inactive-dim-fixed = true;
# never dim: bar, rofi, notifications, fullscreen
focus-exclude = [
  "window_type = 'dock'",
  "window_type = 'notification'",
  "class_g = 'i3bar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "fullscreen"
];
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-leader = true;

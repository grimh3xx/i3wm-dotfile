# Included at the end of kitty.conf.
# color2/color10 are set in kitty.conf (hacker green).
## ═══════════════════════════════════════════════════════════════
##  UNDERGROUND — kitty theme
##  bg near-black · Arch blue accent (#1793d1) · bright cyan
## ═══════════════════════════════════════════════════════════════

## ── Base ──
foreground              #d4d4dc
background              #101014

## ── Selection ──
selection_foreground    #101014
selection_background    #1793d1

## ── Cursor ── (white)
cursor                  #ffffff
cursor_text_color       #101014

## ── URLs ──
url_color               #8ec07c

## ── Window borders (splits) ──
active_border_color     #1793d1
inactive_border_color   #26272f
bell_border_color       #e06c75

## ── Tab bar ──
active_tab_foreground   #101014
active_tab_background   #1793d1
active_tab_font_style   bold
inactive_tab_foreground #6b6c78
inactive_tab_background #17181f
inactive_tab_font_style normal
tab_bar_background      #0b0b0e

## ── Marks ──
mark1_foreground #101014
mark1_background #1793d1
mark2_foreground #101014
mark2_background #8ec07c
mark3_foreground #101014
mark3_background #e06c75

## ── 16-color palette ──
# normal (0-7)
color0  #17181f
color1  #e06c75
color3  #d8a657
color4  #1793d1
color5  #c586c0
color6  #22c7d8
color7  #d4d4dc
# bright (8-15)
color8  #6b6c78
color9  #ff2222
color11 #e9c46a
color12 #4bb3e6
color13 #d7a9d4
color14 #4fd6e6
color15 #ffffff

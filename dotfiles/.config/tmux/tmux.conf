# UNDERGROUND // tmux — prefix Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",st-256color:RGB,xterm-kitty:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
setw -g mode-keys vi

# splits in the current dir: | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# vim keys to move around
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display "reload."
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel clip"

# visual
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#101014,fg=#6b6c78"
set -g status-left "#[bg=#1793d1,fg=#101014,bold] #S #[bg=#101014] "
set -g status-left-length 30
set -g status-right "#[fg=#6b6c78]expect us. #[fg=#26272f]// #[fg=#d4d4dc]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#22c7d8,bold] #I:#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#26272f"
set -g pane-active-border-style "fg=#1793d1"
set -g message-style "bg=#101014,fg=#22c7d8"
setw -g mode-style "bg=#1793d1,fg=#101014"
set -g display-panes-active-colour "#1793d1"
set -g display-panes-colour "#26272f"
setw -g clock-mode-colour "#1793d1"

# UNDERGROUND // mpv
vo=gpu-next
hwdec=auto-safe
keep-open=yes
save-position-on-quit=yes
volume=70
volume-max=150
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
osd-font="CaskaydiaCove Nerd Font"
osd-font-size=28
osd-color="#d4d4dc"
osd-border-color="#101014"
osd-bar-align-y=0.95
osd-bar-h=1.5
osd-level=1
sub-font="CaskaydiaCove Nerd Font"
sub-color="#ffffff"
sub-border-color="#101014"
sub-auto=fuzzy
slang=pt-BR,pt,por,en,eng
alang=jpn,ja,en,eng,pt
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
